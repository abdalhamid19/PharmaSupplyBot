site:
  base_url: "https://seller.tawreed.io/#/login"

# Excel mapping for your file:
# Columns found:
# ["كود","إسم الصنف","كمية النقص", ... "رصيد الوردانى"]
excel:
  code_col: "كود"
  name_col: "إسم الصنف"
  qty_col: "كمية النقص"
  # If you want to compute qty differently, keep qty_col and use `min_qty`/`max_qty`.
  min_qty: 1
  max_qty: 999999

# One or more pharmacy profiles.
# Each profile gets its own saved browser session in state/<profile>.json
profiles:
  wardany:
    display_name: "صيدلية الورداني"
    # If the site has a pharmacy selector after login, set it here (optional).
    pharmacy_switch:
      enabled: false
      pharmacy_name: ""

# UI selectors (update these if the site DOM differs).
# Strategy: keep selectors flexible and editable without changing code.
selectors:
  login:
    email_input: "input[type='email'], input[name='email']"
    password_input: "input[type='password'], input[name='password']"
    submit_button: "button[type='submit']"

  nav:
    # A selector that indicates the app is logged-in and ready.
    logged_in_marker: "text=الرئيسية, text=Home, [data-testid='home']"

  order_flow:
    # These are placeholders; you'll likely need to adjust after we inspect the real UI.
    go_to_orders: "text=الطلبيات, text=Orders"
    new_order: "text=طلبية جديدة, text=New Order, button:has-text('New')"
    item_search_input: "input[placeholder*='بحث'], input[placeholder*='Search']"
    item_first_result: ".results >> :nth-match(*, 1)"
    qty_input: "input[type='number']"
    add_item_button: "text=إضافة, text=Add"
    confirm_order_button: "text=تأكيد, text=Confirm"
  cart_flow:
    route: "#/purchase/carts/"
    rows: "tbody.p-datatable-tbody > tr"
    delete_button: "button:has(.pi-trash), button:has(.pi-times), button:has-text('حذف'), button:has-text('Delete')"
    confirm_delete_button: "button:has-text('تأكيد'), button:has-text('حذف'), button:has-text('Delete'), button:has-text('Yes'), button:has-text('OK')"

warehouse_strategy:
  # Options: "first_available" | "max_available" | "max_discount"
  mode: "first_available"
  # Set to 0 to allow any discount, or e.g. 12 to require stores with >= 12% discount.
  min_discount_percent: 0
  
  # Preferred warehouses (highest to lowest priority)
  # When discounts are equal (within 0.3%), prefer these warehouses in order
  preferred_warehouses:
    - "شركه البركه (الجيزه)"
    - "شركه الماسه (مالك سابقا ) (الجيزه)"
    - "شركه الشفاء ميدكو - الريحان سابقا (الجيزه)"
    - "شركه الفا فارما (الجيزه)"
    - "شركه مصر مديكال (الجيزه)"
    - "شركه نيو سيدرا (القليوبيه)"
    - "شركه الريان (القاهره)"
  
  selectors:
    warehouse_rows: ".warehouse-row, [data-testid='warehouse-row']"
    available_qty: ".available, [data-testid='available']"
    pick_button: "text=اختيار, text=Select"

matching:
  exact_match_accept: true
  high_overlap_threshold: 0.85
  medium_score_threshold: 12.0
  medium_overlap_threshold: 0.6
  numeric_score_threshold: 20.0
  numeric_overlap_threshold: 0.45
  numeric_score_weight: 4.0
  critical_token_penalty: 2.0
  distinguishing_token_penalty: 3.0
  semantic_mismatch_penalty: 10.0
  # Number of candidate options saved into manual-review artifacts.
  manual_review_save_candidate_limit: 10
  # Number of saved candidate options shown by default in the Manual Review UI.
  manual_review_display_candidate_limit: 5

  enable_auto_match_re_review_on_fail: false
  enable_auto_save_verified_match: true
  enable_approved_match_re_review_on_fail: false

  # Manufacturer matching settings / إعدادات مطابقة الشركة المصنعة
  enable_manufacturer_check: false
  manufacturer_match_threshold: 0.85
  # Reject matches with extra brand tokens / رفض المطابقات مع رموز العلامة التجارية الإضافية
  reject_extra_brand_token: false
runtime:
  headless: true
  slow_mo_ms: 0
  timeout_ms: 15000
  submit_order: false
  # Item-level parallel workers per profile. 1 = sequential (default).
  # Each extra worker spawns its own Chromium process (~150MB RAM each).
  # Keep at or below 4 to avoid triggering Tawreed concurrent-session limits.
  item_workers: 1

# ── AI provider defaults ──────────────────────────────────────────────────
# These values populate `resolve_api_config()` and the verifier when the
# operator did not pass `--model` / `--review-model` / `--ai-review-threshold`
# on the command line and the matching env vars (`AI_MODEL`,
# `FALLBACK_MODELS`, `REVIEW_MODEL`, `AI_REVIEW_THRESHOLD`) are unset.
#
# Precedence (highest to lowest):
#   CLI flag > .env override > this file > hardcoded default
#
# Why in YAML and not .env?
#   - These are project config, not secrets.
#   - They ride along with `git` so model changes are reviewable.
#   - .env stays lean (API keys + per-run overrides only).
ai:
  # Primary verification model used by `OPENROUTER_*` keys.
  primary_model: "minimax-m2.5-free"
  # Comma-separated models tried in order when the primary provider fails.
  fallback_models:
    - "nemotron-3-super-free"
    - "hy3-preview-free"
    - "trinity-large-preview-free"
  # Second-opinion model for low-confidence AI verdicts (cross-verification).
  # Leave empty to reuse the primary model for review.
  review_model: "big-pickle"
  # AI verdicts below this confidence are flagged for manual review.
  review_threshold: 0.95

  # Per-provider rotation model pools. Used by `--provider rotation` and
  # `--provider <name>` flows. The first entry is the provider's default
  # when no `--model` / env override is set; subsequent entries are tried
  # in order on cooldown / rate-limit / invalid-JSON events.
  #
  # To override on a single run without editing this file, set the matching
  # env var: `GROQ_MODELS=a,b,c` (CSV). That env var still wins over YAML,
  # matching the precedence chain documented above.
  providers:
    groq:
      default_model: "openai/gpt-oss-120b"
      models:
        - "openai/gpt-oss-120b"
        - "meta-llama/llama-4-scout-17b-16e-instruct"
        - "qwen/qwen3-32b"
        - "llama-3.3-70b-versatile"
        - "groq/compound"
        - "openai/gpt-oss-20b"
        - "groq/compound-mini"
        - "llama-3.1-8b-instant"
        - "allam-2-7b"
    opencode:
      default_model: "big-pickle"
      models:
        - "big-pickle"
        - "nemotron-3-super-free"
        - "minimax-m2.5-free"
        - "deepseek-v4-flash-free"
        - "ring-2.6-1t-free"
        - "trinity-large-preview-free"
        - "hy3-preview-free"
    openrouter:
      default_model: "meta-llama/llama-4-scout-17b-16e-instruct"
      models:
        - "meta-llama/llama-4-scout-17b-16e-instruct"
        - "deepseek/deepseek-r1"
        - "openai/gpt-4o"
        - "meta-llama/llama-3.3-70b-instruct"
        - "openai/gpt-4o-mini"
        - "meta-llama/llama-3.1-8b-instruct"
    cerebras:
      default_model: "qwen-3-235b-a22b-instruct-2507"
      models:
        - "qwen-3-235b-a22b-instruct-2507"
        - "gpt-oss-120b"
        - "zai-glm-4.7"
